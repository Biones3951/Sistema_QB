# Deploy do backend Django no Render (https://render.com)
# O banco fica no Supabase, entao aqui so existe o web service.
services:
  - type: web
    name: sistema-qb-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/products/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: "False"
      # Preencher no painel do Render:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
